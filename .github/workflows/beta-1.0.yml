name: PoStoreBaires Beta 1.0 — Windows and Linux

on:
  push:
    branches: [main]
    tags: ['v1.0.0-beta.1']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
          - runner: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libpulse0
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate source and resources
        run: python scripts/validate.py
      - name: Test transactions and Qt interface
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build native application
        run: python scripts/build.py
      - name: Test the packaged executable
        run: python scripts/smoke.py
      - name: Package this platform
        run: python scripts/package.py --binary-only
      - uses: actions/upload-artifact@v4
        with:
          name: PoStoreBaires-beta-${{ matrix.platform }}
          path: |
            dist/PoStoreBaires-1.0.0-beta.1-${{ matrix.platform }}.*
            dist/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30

  source:
    name: Corresponding source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py --source-only
      - uses: actions/upload-artifact@v4
        with:
          name: PoStoreBaires-beta-source
          path: |
            dist/PoStoreBaires-1.0.0-beta.1-source.zip
            dist/SHA256SUMS-source.txt
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Verify all packages and publish prerelease
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0-beta.1'
    needs: [build, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: PoStoreBaires-beta-*
          merge-multiple: true
          path: dist
      - name: Verify platform and source checksums
        run: python scripts/release.py
      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
